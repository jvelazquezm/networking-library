name: Check pull requests

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday: catch links that rot over time
  workflow_dispatch:

jobs:
  build:
    name: Build (fails on broken internal links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  external-links:
    name: External links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,204,403,429
            --exclude-path node_modules
            'docs/**/*.md' README.md
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Open an issue with broken links (scheduled runs)
        if: github.event_name == 'schedule' && env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links found
          content-filepath: ./lychee/out.md
          labels: broken-links
